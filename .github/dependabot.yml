version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /
      - /examples/simple
      - /examples/complete
      - /examples/existing-listener
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
